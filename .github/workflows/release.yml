name: Release

# 只认规范的版本 tag。v* 会把随手打的实验 tag 也发成正式 release——
# 而 releases/latest 直链正是一键部署的数据源，实验版会被所有新装机装上。
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --prefix web
      - name: 完整发布前验证
        run: |
          npm run typecheck --prefix web
          npm test --prefix web
          npm run build --prefix web
          git diff --exit-code -- internal/webui/dist
          go test ./...
          go vet ./...
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: 生成发布来源证明
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'dist/*.tar.gz'

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          # 带连字符的 tag（v1.0.0-rc.1）标为预发布：它不会成为 releases/latest，
          # 一键部署的用户不会装到它，而发布链路本身仍被完整演练一遍。
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
