name: Release

# 只认规范的版本 tag。v* 会把随手打的实验 tag 也发成正式 release——
# 而 releases/latest 直链正是一键部署的数据源，实验版会被所有新装机装上。
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --prefix web
      - name: 完整发布前验证
        run: |
          npm run typecheck --prefix web
          npm test --prefix web
          npm run build --prefix web
          git diff --exit-code -- internal/webui/dist
          go test ./...
          go vet ./...
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: 生成发布来源证明
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz'

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          # 带连字符的 tag（v1.0.0-rc.1）标为预发布：它不会成为 releases/latest，
          # 一键部署的用户不会装到它，而发布链路本身仍被完整演练一遍。
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  # 发布完成后立即真装一遍。
  #
  # 必须在这里显式调用，不能指望装机验证自己的 release: published 触发器：
  # 用 GITHUB_TOKEN 创建的 release 不会触发新的工作流，那个触发器对本流水线
  # 发出的版本永远不响（v0.3.0 实测如此）。
  smoke:
    needs: release
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ github.ref_name }}

  # 正式版的全部装机验证通过后，RC 已完成使命；同时删除 Release 与 tag，
  # 避免版本列表持续堆积。预发布自身不会触发这一步。
  cleanup-prereleases:
    needs: smoke
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/cleanup-prereleases.yml
