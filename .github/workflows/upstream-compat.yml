name: kdae 上游兼容

on:
  workflow_dispatch:
  schedule:
    # 版本发现契约每天验一次：它依赖的发布命名、.dgst 格式与 Actions 接口都在
    # 上游手里，改了不会有人通知我们，只能自己勤查。
    - cron: '17 3 * * *'
    # 上游构建契约每周一次：要装 clang/llvm 再全量编译 kdae，每天跑不划算。
    - cron: '43 4 * * 1'

permissions:
  contents: read

concurrency:
  group: kdae-upstream-compat
  cancel-in-progress: true

jobs:
  # 版本发现契约独立成一个 job，不搭在构建之后。
  # 挂在"构建 kdae"后面的话，上游一旦构建坏掉，这个检查就完全不跑——而它恰恰是
  # 唯一能发现"上游改了打包方式，面板一个版本都装不上"的地方。
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出面板
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      # 版本发现与 geo 数据都依赖上游的资产命名与校验和格式，这些都在面板之外，
      # 只有对真实上游跑一遍才能发现它们变了。
      - name: 验证版本发现与 geo 数据契约
        env:
          KDAE_UPSTREAM_LIVE: '1'
          # 匿名调用 GitHub API 是每出口 IP 每小时 60 次，而 runner 的出口 IP
          # 是共享的。这一步一次要打四路上游加面板自身，此前常因额度耗尽而失败——
          # 报的是限流，看起来却像上游契约破了。Actions 自带的 token 有每小时
          # 1000 次，只读公开仓库足够，且 permissions 已限定 contents: read。
          KDAE_PANEL_GITHUB_TOKEN: ${{ github.token }}
        # 两个包都要跑：upstream 验证上游的资产命名与校验和格式，
        # geodata 验证取到之后的落盘与回滚。只列前者的话，后者等于没写。
        run: go test -count=1 -run '^TestLive' -timeout=12m ./internal/upstream ./internal/geodata

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'schedule' || github.event.schedule == '43 4 * * 1'
    steps:
      - name: 检出面板
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 检出 kdae 分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: olicesx/dae
          ref: kdae
          path: upstream
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # kdae 独立决定自己的 Go 基线；直接读上游 go.mod，避免它升级后
          # 兼容检查还停在面板的工具链版本而在真正验证契约前就失败。
          go-version-file: upstream/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            upstream/go.sum

      - name: 安装上游构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang llvm

      - name: 构建 kdae
        run: make -C upstream dae NOSTRIP=y DEFAULT_GOEXPERIMENT= OUTPUT=dae-contract

      # Git 不记录普通文件的读权限，检出的示例配置固定是 0644；kdae 会拒绝
      # 其他用户可读的配置。复制成面板生产环境实际使用的 0600 再验证。
      - name: 准备契约配置
        run: install -m0600 upstream/example.dae "${RUNNER_TEMP}/kdae-contract.dae"

      - name: 验证面板与 kdae 公开契约
        env:
          KDAE_CONTRACT_BINARY: ${{ github.workspace }}/upstream/dae-contract
          KDAE_CONTRACT_CONFIG: ${{ runner.temp }}/kdae-contract.dae
        run: go test -count=1 -run '^TestUpstreamContract$' -timeout=4m ./internal/dae
