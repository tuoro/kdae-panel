name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        run: npm ci --prefix web

      - name: 检查前端类型并生成嵌入资源
        run: |
          npm run typecheck --prefix web
          npm test --prefix web
          npm run build --prefix web

      - name: 确认嵌入资源已同步
        run: git diff --exit-code -- internal/webui/dist

      - name: Go 测试与静态检查
        run: |
          go test ./...
          go vet ./...

      # ./... 而不是硬编码包列表：列表已经漂移过两次（漏 internal/command、
      # 漏 geodata），没有测试的包只会打一行 "no test files"，不值得为省它维护清单。
      - name: 并发竞争检查
        run: go test -race ./...

      - name: Go 漏洞扫描
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Linux 构建
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o bin/kdae-panel ./cmd/kdae-panel

      # 发布要出三个架构的包，但另外两个此前只在 tag 推送后才第一次编译——
      # 架构级断裂（依赖不支持 riscv64 之类）发现时 tag 已经打出去了。
      - name: 交叉编译冒烟（arm64/riscv64）
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/kdae-panel
          GOARCH=riscv64 go build -trimpath -o /dev/null ./cmd/kdae-panel

  # 端到端冒烟：真浏览器打真面板（systemctl/dae 用桩），一条链路压过
  # 路由守卫、CSRF、配置事务与 dae 校验——单元测试各自为战覆盖不到的接缝。
  # 面板嵌入的是已提交的 dist，test 作业已确认它与前端源码同步。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: 构建面板与桩
        run: |
          go build -o e2e/bin/kdae-panel ./cmd/kdae-panel
          go build -o e2e/bin/systemctl ./e2e/stubs/systemctl
          go build -o e2e/bin/dae ./e2e/stubs/dae
          go build -o e2e/bin/journalctl ./e2e/stubs/journalctl

      - name: 安装 E2E 依赖
        working-directory: e2e
        run: npm ci

      - name: 安装浏览器
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: 端到端冒烟
        working-directory: e2e
        run: npm test
